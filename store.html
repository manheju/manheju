<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>漫和居公寓 · 门店详情</title><link rel="stylesheet" href="assets/css/main.css"></head>
<body>
<div id="demoBanner" class="demo-banner" style="display:none">当前为演示模式（示例数据）</div>
<main class="wrap" style="padding-top:0"><div id="app"><div class="empty" style="margin-top:24px">正在加载…</div></div></main>
<div class="lightbox" id="lightbox"><img id="lightboxImg" alt="放大图"></div>
<script src="js/config.js"></script><script src="js/demo-data.js"></script><script src="js/data-service.js"></script>
<script>
if(!ManjuData.isLive) document.getElementById('demoBanner').style.display='block';
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function getSlug(){ const q=new URLSearchParams(location.search).get('store'); if(q) return q; const p=location.pathname.match(/\/store\/([\w-]+)/); return p?p[1]:null; }
const slug=getSlug(), app=document.getElementById('app');
const lb=document.getElementById('lightbox'); lb.addEventListener('click',()=>lb.classList.remove('open'));
window.zoom=function(src){ document.getElementById('lightboxImg').src=src; lb.classList.add('open'); };
(async()=>{
  if(!slug){ app.innerHTML='<div class="empty" style="margin-top:24px">链接里缺少门店，请从首页进入。<br><a href="index.html">← 返回首页</a></div>'; return; }
  try{
    const store=await ManjuData.getPublicStoreBySlug(slug);
    if(!store){ app.innerHTML='<div class="empty" style="margin-top:24px">这家门店暂未开放，或链接有误。<br><a href="index.html">← 返回首页查看其他门店</a></div>'; return; }
    document.title='漫和居公寓 · '+store.name;
    const types=await ManjuData.listPublicRoomTypes(store.id);
    const media=await ManjuData.listMediaForTypes(types.map(t=>t.id));
    const hl=(Array.isArray(store.highlights)?store.highlights:(typeof store.highlights==='string'&&store.highlights?store.highlights.split(/[,，]/):[])).map(x=>String(x).trim()).filter(Boolean);
    app.innerHTML=`
      <div class="backbar"><a href="index.html">‹ 全部门店</a></div>
      ${store.cover_url?`<img class="cover-hero" src="${esc(store.cover_url)}" alt="${esc(store.name)}">`:''}
      <div class="store-head"><h1>${esc(store.name)}</h1>
      <div class="price"><b>${esc(store.starting_price)}</b> 元/月起 <small>· 押一付一 · 无中介费</small></div>
      <div class="loc"><div>📍 ${esc(store.address||'')}</div>
      ${store.transit_name?`<div>🚇 ${esc(store.transit_name)}${store.transit_distance?' · '+esc(store.transit_distance):''}</div>`:''}
      ${store.landmark?`<div>🏙 附近：${esc(store.landmark)}</div>`:''}</div>
      ${store.summary?`<p style="color:var(--muted)">${esc(store.summary)}</p>`:''}
      ${hl.length?`<div class="tags" style="margin-top:12px">${hl.map((h,j)=>`<span class="tag${j<2?' hot':''}">${esc(h)}</span>`).join('')}</div>`:''}</div>

      <h2 class="section-title">房型展示<small>${types.length?types.length+' 种房型':''}</small></h2>
      ${types.length?types.map(t=>{ const ms=media[t.id]||[]; const gallery = ms.length?ms: (t.cover_url?[{media_type:'image',media_url:t.cover_url}]:[]);
        return `<article class="type-card">${gallery.length?`<div class="gallery">${gallery.map(m=> m.media_type==='video'
          ? `<video controls playsinline preload="none" poster="${esc(t.cover_url||'')}" src="${esc(m.media_url)}"></video>`
          : `<img loading="lazy" decoding="async" src="${esc(m.media_url)}" alt="${esc(t.name)}" onclick="zoom(this.src)">`).join('')}</div>`:''}
        <div class="type-body"><h3>${esc(t.name)}</h3><p>${esc(t.summary||'')}</p>
        ${t.highlights&&t.highlights.length?`<div class="tags">${(Array.isArray(t.highlights)?t.highlights:t.highlights.split(/[,，]/)).map(h=>`<span class="tag">${esc(h)}</span>`).join('')}</div>`:''}</div></article>`}).join(''):'<div class="empty">这家门店的房型照片正在整理中</div>'}


      <section class="fees"><h3>收费说明（统一）</h3><ul>
      <li>电费：1–1.2元/度，水费 5元/吨，实表实时查询</li>
      <li>公寓管理费 150元/月，包含宽带网络、公区打扫、家电家具维修</li>
      <li>无中介费，自家房源直租，自有团队打理，安全性好</li>
      <li>押一付一，租期灵活，具体请微信咨询</li></ul></section>
      ${(store.contact_phone||store.wechat_qr_url)?`<section class="contact-card"><div class="cc-left"><div class="cc-title">联系门店</div>${store.contact_phone?`<a class="cc-phone" href="tel:${esc(store.contact_phone)}">📞 ${esc(store.contact_phone)}</a><div class="cc-note">点号码直接打电话</div>`:''}</div>${store.wechat_qr_url?`<div class="cc-qr"><img src="${esc(store.wechat_qr_url)}" alt="微信二维码" onclick="zoom(this.src)"><div>扫码加微信 · 点图放大</div></div>`:''}</section>`:''}
      <div class="sticky-cta"><div><div class="p"><b>${esc(store.starting_price)}</b> 元/月起</div><div class="n">${esc(store.name)}</div></div><div class="n" style="text-align:right">房源实时更新<br>看房请微信联系门店</div></div>
      <footer><span class="foot-card">漫和居公寓 · ${esc(store.name)}<br>看中房源请通过微信直接联系门店</span></footer>`;
  }catch(e){ app.innerHTML='<div class="empty" style="margin-top:24px">这家店没加载出来，可能是网络信号不好。<br><a href="javascript:location.reload()" style="color:var(--accent);font-weight:700">点这里重新加载</a><br><br><a href="index.html">← 返回全部门店</a></div>'; }
})();
</script></body></html>
