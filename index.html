<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>漫和居公寓 · 武汉精装公寓直租</title><link rel="stylesheet" href="assets/css/main.css"></head>
<body>
<div id="demoBanner" class="demo-banner" style="display:none">当前为演示模式（示例数据）· 配置 Supabase 后自动切换为正式数据</div>
<div class="topbar"><span class="brand">漫和居公寓</span><span class="tb-badge">自家直租 · 无中介费</span></div>
<header class="hero"><h1><span class="en">Manheju Apartment · Wuhan</span>漫和居公寓</h1>
<p class="slogan">住得近，住得好。</p>
<p>武汉精装公寓直租 · 6 家门店，按地址选你最顺路的那家</p>
<div class="common-adv"><span>精装</span><span>拎包入住</span><span>家具家电齐全</span><span>押一付一</span></div></header>
<main class="wrap" style="padding-bottom:16px">
  <p class="pick-hint">点进门店，看房型图片和当前空房 ↓</p>
  <div id="storeList">
    <div class="skel"><div class="b" style="width:104px;height:118px"></div><div style="flex:1"><div class="b" style="height:20px;width:55%;margin-bottom:10px"></div><div class="b" style="height:14px;width:85%;margin-bottom:8px"></div><div class="b" style="height:14px;width:70%"></div></div></div>
    <div class="skel"><div class="b" style="width:104px;height:118px"></div><div style="flex:1"><div class="b" style="height:20px;width:50%;margin-bottom:10px"></div><div class="b" style="height:14px;width:80%;margin-bottom:8px"></div><div class="b" style="height:14px;width:65%"></div></div></div>
    <div class="skel"><div class="b" style="width:104px;height:118px"></div><div style="flex:1"><div class="b" style="height:20px;width:58%;margin-bottom:10px"></div><div class="b" style="height:14px;width:82%;margin-bottom:8px"></div><div class="b" style="height:14px;width:72%"></div></div></div>
  </div>
</main>
<footer><span class="foot-card">漫和居公寓 · 武汉<br>房源实时更新，看到心仪的请尽快联系门店</span></footer>
<script src="js/config.js"></script><script src="js/demo-data.js"></script><script src="js/data-service.js"></script>
<script>
if(!ManjuData.isLive) document.getElementById('demoBanner').style.display='block';
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function tagsOf(s){
  let t = Array.isArray(s.highlights) ? s.highlights : (typeof s.highlights==='string' && s.highlights ? s.highlights.split(/[,，]/) : []);
  t = t.map(x=>String(x).trim()).filter(Boolean);
  if(!t.length){ // 正式数据没填优势时，用交通/地标自动兜底，保证一目了然
    t=['精装','拎包入住'];
    if(s.transit_name) t.push(s.transit_distance ? (s.transit_name+' '+s.transit_distance) : s.transit_name);
    else if(s.landmark) t.push('近'+s.landmark);
  }
  return t.slice(0,7);
}
ManjuData.listPublicStores().then(stores=>{
  const el=document.getElementById('storeList');
  if(!stores.length){ el.innerHTML='<div class="empty">暂时还没有已开放的门店</div>'; return; }
  if(stores[0] && stores[0]._cached){ el.innerHTML='<div style="text-align:center;color:var(--faint);font-size:12.5px;margin:0 0 10px">网络较慢，先显示缓存的门店信息，点进门店看最新房源</div>'; } else { el.innerHTML=''; }
  el.innerHTML+=stores.map((s,i)=>`<a class="store-row" style="--i:${i}" href="store.html?store=${encodeURIComponent(s.slug)}">
    ${s.cover_url?`<img class="thumb" loading="lazy" src="${esc(s.cover_url)}" alt="">`:`<span class="thumb-none">漫和居</span>`}
    <span class="info"><span class="top"><h3>${esc(s.name)}</h3><span class="price"><b>${esc(s.starting_price)}</b>元<small style="font-size:12px;color:var(--muted);font-weight:400">/月起</small></span></span>
    <span class="addr">📍 ${esc(s.address||'')}${s.transit_name?`<br>🚇 ${esc(s.transit_name)}${s.transit_distance?' · '+esc(s.transit_distance):''}`:''}</span>
    <span class="tags">${tagsOf(s).map((h,j)=>`<span class="tag${j<2?' hot':''}">${esc(h)}</span>`).join('')}</span></span>
    <span class="go">›</span></a>`).join('');
}).catch(e=>{ document.getElementById('storeList').innerHTML='<div class="empty">门店没加载出来，可能是网络信号不好。<br><a href="javascript:location.reload()" style="color:var(--accent);font-weight:700">点这里重新加载</a></div>'; });
</script></body></html>
